[mypy]
python_version = 3.12
ignore_missing_imports = True
allow_untyped_decorators = True
warn_unused_ignores = False

# SQLModel dynamic column operators (.is_, .ilike, .in_)
# are dynamically resolved at runtime and invisible to mypy.
# These are KNOWN false positives — accepted SQLModel trade-off.
disable_error_code = union-attr, attr-defined, arg-type

[mypy-backend.productos.*]
disallow_untyped_defs = False

[mypy-backend.core.*]
disallow_untyped_defs = False

[mypy-backend.models.*]
ignore_errors = True
